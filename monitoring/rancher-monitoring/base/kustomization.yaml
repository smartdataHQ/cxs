resources:
  - namespace.yaml
  # prometheus-operator CRDs, vendored verbatim from chart
  # rancher-monitoring-crd 108.0.1+up77.9.1-rancher.10 (the chart wraps them in
  # a bz2 ConfigMap + hook Job, which ArgoCD orders wrongly — plain CRDs sync
  # before the CRs that need them). Re-vendor when bumping the chart version:
  #   helm template rancher-monitoring-crd --repo https://charts.rancher.io \
  #     --version <ver> | <extract data."crds.bz2.b64"> | base64 -d | bunzip2
  - crds.yaml
