resources:
  - ../../base/

helmCharts:
  # Same chart + version the fraios dev cluster runs. The matching
  # prometheus-operator CRDs are vendored in ../../base/crds.yaml — they
  # already exist on the cluster from a 2024 install and are too large for
  # client-side apply; the patch below forces ServerSideApply on them.
  - name: rancher-monitoring
    repo: https://charts.rancher.io
    releaseName: rancher-monitoring
    version: 108.0.1+up77.9.1-rancher.10
    namespace: cattle-monitoring-system
    valuesFile: values.yaml

patches:
  - target:
      kind: CustomResourceDefinition
    patch: |-
      apiVersion: apiextensions.k8s.io/v1
      kind: CustomResourceDefinition
      metadata:
        name: ignored-by-target-selector
        annotations:
          argocd.argoproj.io/sync-options: ServerSideApply=true
  # Drop the chart's helm `pre-upgrade` migration machinery: ArgoCD maps
  # pre-upgrade hooks to PreSync, so this Job would DELETE the node-exporter
  # DaemonSet and kube-state-metrics Deployment on EVERY sync before
  # re-applying them. It only exists to migrate labels between chart major
  # versions under `helm upgrade`; useless and harmful here.
  - target:
      kind: Job
      name: rancher-monitoring-upgrade
    patch: &delete-patch |-
      $patch: delete
      apiVersion: v1
      kind: Ignored
      metadata:
        name: ignored
  - target:
      kind: ConfigMap
      name: rancher-monitoring-upgrade
    patch: *delete-patch
  - target:
      kind: ServiceAccount
      name: rancher-monitoring-upgrade
    patch: *delete-patch
  - target:
      kind: ClusterRole
      name: rancher-monitoring-upgrade
    patch: *delete-patch
  - target:
      kind: ClusterRoleBinding
      name: rancher-monitoring-upgrade
    patch: *delete-patch
  - target:
      kind: Role
      name: rancher-monitoring-upgrade
    patch: *delete-patch
  - target:
      kind: RoleBinding
      name: rancher-monitoring-upgrade
    patch: *delete-patch
