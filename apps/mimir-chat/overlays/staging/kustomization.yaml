apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: solutions

images:
  - name: quicklookup/mimir-chat
    newTag: 4f81a6b

resources:
  - ../../base

# The staging config and ingress change the base's objects of the same name.
# Listed as resources they collide with the base ("already registered id") and
# the overlay does not build; as patches they are merged over it.
patches:
  - path: mimir-chat-config.yaml
  - path: mimir-chat-ingress.yml
  - target:
      kind: Deployment
      name: mimir-chat-web
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: "100m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "128Mi"
