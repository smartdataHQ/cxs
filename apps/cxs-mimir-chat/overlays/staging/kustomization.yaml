apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: solutions

images:
  - name: quicklookup/mimir-chat
    newTag: "55e18a8"

configMapGenerator:
  - name: cxs-mimir-web-config
    behavior: merge
    literals:
      # Same agents API host as production; only this app's own origin
      # (BROWSER_APP_API, NEXT_PUBLIC_APP_URL) is staging-specific.
      - BROWSER_CHAT_API=https://agents.fraios.dev
      - BROWSER_APP_API=https://agents.contextsuite.dev
      - MIMIR_SERVER_API=https://agents.fraios.dev
      - BROWSER_CHAT_WSS_API=wss://agents.fraios.dev
      - NEXT_PUBLIC_APP_URL=https://agents.contextsuite.dev

resources:
  - ../../base

